<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8471FA" />
      <stop offset="100%" stop-color="#6750F5" />
    </linearGradient>
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3BE" />
      <stop offset="100%" stop-color="#18B6A4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6BB5FF" />
      <stop offset="100%" stop-color="#49A6FF" />
    </linearGradient>
    <linearGradient id="meshLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2B7FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8471FA" stop-opacity="0.3" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Surrounding Network Connection Orbits & Nodes (Multi-Format Universal Conversion) -->
  <g opacity="0.85">
    <!-- Orbital Nodes & Data Streams -->
    <circle cx="256" cy="62" r="7" fill="#6BB5FF" filter="url(#glow)" />
    <line x1="256" y1="70" x2="256" y2="128" stroke="#6BB5FF" stroke-width="2.5" stroke-dasharray="4,4" />

    <circle cx="438" cy="168" r="6" fill="#8471FA" filter="url(#glow)" />
    <line x1="432" y1="172" x2="384" y2="200" stroke="#8471FA" stroke-width="2.5" stroke-dasharray="4,4" />

    <circle cx="438" cy="344" r="6.5" fill="#22D3BE" filter="url(#glow)" />
    <line x1="432" y1="340" x2="384" y2="312" stroke="#22D3BE" stroke-width="2.5" stroke-dasharray="4,4" />

    <circle cx="256" cy="450" r="7" fill="#18B6A4" filter="url(#glow)" />
    <line x1="256" y1="442" x2="256" y2="384" stroke="#18B6A4" stroke-width="2.5" stroke-dasharray="4,4" />

    <circle cx="74" cy="344" r="6.5" fill="#49A6FF" filter="url(#glow)" />
    <line x1="80" y1="340" x2="128" y2="312" stroke="#49A6FF" stroke-width="2.5" stroke-dasharray="4,4" />

    <circle cx="74" cy="168" r="6" fill="#6750F5" filter="url(#glow)" />
    <line x1="80" y1="172" x2="128" y2="200" stroke="#6750F5" stroke-width="2.5" stroke-dasharray="4,4" />
  </g>

  <!-- ISOMETRIC 3D CENTRAL CUBE -->
  <!-- Top Face: Polygonal Mesh Representation (Primary #6750F5) -->
  <path d="M 256,128 L 384,202 L 256,276 L 128,202 Z"
        fill="url(#primaryGrad)"
        stroke="#9B8BFA"
        stroke-width="2" />

  <!-- Top Face Mesh Wireframe Grid & Triangular Edges -->
  <g stroke="url(#meshLineGrad)" stroke-width="1.8" opacity="0.9">
    <line x1="192" y1="165" x2="320" y2="239" />
    <line x1="256" y1="128" x2="256" y2="276" />
    <line x1="192" y1="239" x2="320" y2="165" />
    <line x1="128" y1="202" x2="384" y2="202" />
    <!-- Mesh Vertex Nodes -->
    <circle cx="256" cy="202" r="3.5" fill="#FFFFFF" />
    <circle cx="192" cy="165" r="2.5" fill="#E0D9FF" />
    <circle cx="320" cy="165" r="2.5" fill="#E0D9FF" />
    <circle cx="192" cy="239" r="2.5" fill="#E0D9FF" />
    <circle cx="320" cy="239" r="2.5" fill="#E0D9FF" />
  </g>

  <!-- Left Face: Minecraft Voxel / Block Representation (Secondary #18B6A4) -->
  <path d="M 128,202 L 256,276 L 256,384 L 128,310 Z"
        fill="url(#secondaryGrad)"
        stroke="#3BE1CE"
        stroke-width="2" />

  <!-- Voxel Step Pattern / Blocks on Left Face -->
  <g stroke="#108E80" stroke-width="1.8" fill="#14A493" opacity="0.95">
    <!-- Voxel Grid Lines -->
    <line x1="192" y1="239" x2="192" y2="347" stroke="#22D3BE" stroke-width="1.5" />
    <line x1="128" y1="256" x2="256" y2="330" stroke="#22D3BE" stroke-width="1.5" />

    <!-- 3D Stepped Voxel Sub-cubes -->
    <path d="M 160,256 L 192,274 L 192,311 L 160,293 Z" fill="#20C4B1" stroke="#4EF1DF" stroke-width="1.2" />
    <path d="M 160,256 L 192,274 L 160,293 L 128,274 Z" fill="#28D6C2" stroke="#4EF1DF" stroke-width="1.2" />
    <path d="M 192,274 L 224,293 L 224,330 L 192,311 Z" fill="#17A796" stroke="#4EF1DF" stroke-width="1.2" />
  </g>

  <!-- Right Face: JSON & Bedrock Geometry / Bones Representation (Accent #49A6FF) -->
  <path d="M 256,276 L 384,202 L 384,310 L 256,384 Z"
        fill="url(#accentGrad)"
        stroke="#75BFFF"
        stroke-width="2" />

  <!-- Geometry Bones / Pivots on Right Face -->
  <g stroke="#FFFFFF" stroke-width="1.8" opacity="0.9">
    <line x1="288" y1="294" x2="352" y2="257" stroke="#A8D5FF" stroke-width="2" />
    <line x1="288" y1="365" x2="352" y2="328" stroke="#A8D5FF" stroke-width="2" />
    <line x1="320" y1="239" x2="320" y2="347" stroke="#A8D5FF" stroke-width="2" />

    <!-- Joint Nodes -->
    <circle cx="320" cy="293" r="5" fill="#FFFFFF" stroke="#2478CC" stroke-width="1.5" />
    <circle cx="288" cy="257" r="3.5" fill="#D4EAFF" />
    <circle cx="352" cy="257" r="3.5" fill="#D4EAFF" />
    <circle cx="288" cy="330" r="3.5" fill="#D4EAFF" />
    <circle cx="352" cy="330" r="3.5" fill="#D4EAFF" />
  </g>

  <!-- Central Nexus Core Connector (Intersection Point) -->
  <circle cx="256" cy="276" r="9" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="256" cy="276" r="5" fill="#6750F5" />
</svg>

