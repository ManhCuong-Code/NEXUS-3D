name: Release NEXUS-3D

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Package and Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup Compiler
        run: |
          choco install innosetup --no-progress

      - name: Run Full Test Suite
        run: |
          dotnet test NEXUS-3D.sln -c Release --verbosity normal

      - name: Package Release Artifacts
        shell: powershell
        run: |
          .\scripts\package-release.ps1 -Configuration Release -Runtime win-x64 -Version "${{ github.ref_name }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: NEXUS-3D Universal 3D & Schematic Converter ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/*.zip
            dist/installer/*.exe
            dist/nuget/*.nupkg
            dist/plugins/*.nexusplugin
            dist/SHA256SUMS.txt
